name: Build

on:
  push:
    branches:
      - main
      - h2-provider
  pull_request:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Release]
        include:
          - os: ubuntu-latest
            config: Debug

    steps:
      # The provider is built against the engine, and the engine is a sibling checkout rather
      # than a package: it is not on nuget.org yet. The two are checked out side by side,
      # which is the layout the provider's project reference expects.
      - name: Checkout the provider
        uses: actions/checkout@v4
        with:
          path: provider

      - name: Checkout the engine
        uses: actions/checkout@v4
        with:
          repository: dimzon/h2sharp
          path: h2sharp

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4

      - name: Build
        run: dotnet build --configuration ${{ matrix.config }}
        working-directory: provider
        shell: bash

      - name: Test
        run: dotnet test --configuration ${{ matrix.config }} --no-build --logger "GitHubActions;report-warnings=false"
        working-directory: provider
        shell: bash
