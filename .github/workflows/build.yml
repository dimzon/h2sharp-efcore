name: Build

on:
  push:
    branches:
      - main
      - h2-provider
  pull_request:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Release]
        include:
          - os: ubuntu-latest
            config: Debug

    steps:
      # The provider is built against the engine, and the engine is a sibling checkout rather
      # than a package: it is not on nuget.org yet. The two are checked out side by side,
      # which is the layout the provider's project reference expects.
      - name: Checkout the provider
        uses: actions/checkout@v4
        with:
          path: provider

      - name: Checkout the engine
        uses: actions/checkout@v4
        with:
          repository: dimzon/h2sharp
          path: h2sharp

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6

      - name: Build
        run: dotnet build --configuration ${{ matrix.config }}
        working-directory: provider
        shell: bash

      - name: Test
        run: dotnet test --configuration ${{ matrix.config }} --no-build --logger "GitHubActions;report-warnings=false"
        working-directory: provider
        shell: bash

  # The coverage of the provider is measured in Debug: in Release the inlining of the compiler
  # smears the lines, and the number stops meaning anything. The threshold is held by
  # tools/CheckCoverage.ps1.
  coverage:
    name: Coverage of the provider
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the provider
        uses: actions/checkout@v4
        with:
          path: provider

      - name: Checkout the engine
        uses: actions/checkout@v4
        with:
          repository: dimzon/h2sharp
          path: h2sharp

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6

      - name: Test with the collector of the coverage
        run: >-
          dotnet test test/H2Sharp.EntityFrameworkCore.ModelTests
          --configuration Debug --settings coverlet.runsettings
          --collect "XPlat Code Coverage" --results-directory TestResults
        working-directory: provider
        shell: bash

      - name: The coverage is above the threshold
        run: pwsh tools/CheckCoverage.ps1 -ResultsDirectory TestResults
        working-directory: provider
        shell: bash
